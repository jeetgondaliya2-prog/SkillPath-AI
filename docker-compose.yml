services:

  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile

    container_name: skillpath-backend

    ports:
      - "8000:8000"

    environment:
      MISTRAL_API_KEY: ${MISTRAL_API_KEY}

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile

    container_name: skillpath-frontend

    ports:
      - "8501:8501"

    environment:
      BACKEND_URL: http://backend:8000

    depends_on:
      - backend